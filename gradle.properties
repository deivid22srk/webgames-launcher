# JVM
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Resiliência de rede (429 do Maven Central)
org.gradle.internal.repository.max.retries=8
org.gradle.internal.repository.initial.backoff=1500
