name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  rust-tests:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Testes
        run: cargo test --workspace

  android:
    name: Android (Rust NDK + Gradle)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          prefix-key: android

      - name: Instalar cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Instalar NDK r29
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;${NDK_VERSION}" "platforms;android-37.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Preparar keystore de release
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Usando KEYSTORE_BASE64 dos secrets"
            echo "$KEYSTORE_BASE64" | base64 -d > ci.jks
          else
            echo "Sem secrets: gerando keystore efêmero de CI (não use em produção)"
            keytool -genkeypair -v -keystore ci.jks \
              -storepass webgames-ci-pass -keypass webgames-ci-pass \
              -alias webgames -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=WebGames CI, OU=CI, O=deivid22srk, L=BR, ST=BR, C=BR"
          fi

      - name: Build (Rust NDK + Gradle)
        run: |
          ./gradlew assembleDebug assembleRelease :app:testDebugUnitTest \
            :app:assembleDebugAndroidTest :app:lintDebug --stacktrace
        env:
          CI_KEYSTORE_PATH: ${{ github.workspace }}/ci.jks
          CI_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'webgames-ci-pass' }}
          CI_KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'webgames' }}
          CI_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'webgames-ci-pass' }}

      - name: Renomear APKs
        run: |
          mkdir -p apks
          cp app/build/outputs/apk/debug/app-debug.apk apks/webgames-launcher-debug.apk
          cp app/build/outputs/apk/release/app-release.apk apks/webgames-launcher-release.apk
          ls -la apks

      - name: Upload artefatos
        uses: actions/upload-artifact@v7
        with:
          name: webgames-launcher-apks
          path: apks/*.apk
          if-no-files-found: error

      - name: GitHub Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "WebGames Launcher ${GITHUB_REF_NAME}" \
            --generate-notes \
            apks/webgames-launcher-debug.apk \
            apks/webgames-launcher-release.apk
